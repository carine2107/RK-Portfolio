# Production stack of the Romial Kenmogne website: application + PostgreSQL.
#
#   cp .env.production.example .env.production   # then fill it in (chmod 600)
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env.production -f docker-compose.prod.yml exec app npm run seed   # first time only
#
# The application listens on 127.0.0.1 only: publish it through the reverse
# proxy (HTTPS), see docs/DEPLOIEMENT.md.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        NEXT_PUBLIC_ANALYTICS_PROVIDER: ${NEXT_PUBLIC_ANALYTICS_PROVIDER:-}
        NEXT_PUBLIC_ANALYTICS_SCRIPT_URL: ${NEXT_PUBLIC_ANALYTICS_SCRIPT_URL:-}
        NEXT_PUBLIC_ANALYTICS_SITE_ID: ${NEXT_PUBLIC_ANALYTICS_SITE_ID:-}
    env_file: .env.production
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-romial}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-romial_website}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${APP_PORT:-4313}:4313'
    volumes:
      # Mandatory: without it every redeployment would erase the uploaded media.
      - media:/app/public/media
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-romial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-romial_website}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  media:
  db:
