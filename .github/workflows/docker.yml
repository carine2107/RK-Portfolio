# Production Docker image and deployment.
#
# After a green CI run on main (and for version tags v*), the image is built from
# the Dockerfile. It is published to the GitHub Container Registry
# (ghcr.io/carine2107/rk-portfolio) only once the repository variable
# NEXT_PUBLIC_SITE_URL is set (Settings → Secrets and variables → Actions →
# Variables): that address is written into the image at build time.
#
# For main, the published image is then deployed to the server over SSH: the
# deploy key can only run ops/deploy.sh (backup, pull, restart, health check,
# rollback). Until the DEPLOY_* secrets exist, the deploy job only says so.
# See docs/DEPLOIEMENT.md §3.
name: Docker image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Queued, never cancelled: a new push must not interrupt a deployment.
concurrency:
  group: docker-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/carine2107/rk-portfolio

jobs:
  image:
    name: Build (and publish) the image
    # After CI: only when it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      published: ${{ steps.settings.outputs.publish }}
      tag: ${{ steps.settings.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI validated, not the latest one on the branch.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Tags and publication
        id: settings
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          sha_tag="sha-${HEAD_SHA::7}"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          tags="${IMAGE}:${sha_tag}"
          if [ "$EVENT" = "workflow_run" ] || [ "$REF" = "refs/heads/main" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          if [[ "$REF" == refs/tags/v* ]]; then
            tags="${tags},${IMAGE}:${REF#refs/tags/v}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          if [ -n "$SITE_URL" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Image not published::Set the repository variable NEXT_PUBLIC_SITE_URL to publish the image to ghcr.io. This run only checks that the image builds."
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: steps.settings.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.settings.outputs.publish == 'true' }}
          tags: ${{ steps.settings.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Romial Kenmogne website
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:4313' }}
            NEXT_PUBLIC_ANALYTICS_PROVIDER=${{ vars.NEXT_PUBLIC_ANALYTICS_PROVIDER }}
            NEXT_PUBLIC_ANALYTICS_SCRIPT_URL=${{ vars.NEXT_PUBLIC_ANALYTICS_SCRIPT_URL }}
            NEXT_PUBLIC_ANALYTICS_SITE_ID=${{ vars.NEXT_PUBLIC_ANALYTICS_SITE_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          PUBLISH: ${{ steps.settings.outputs.publish }}
          TAGS: ${{ steps.settings.outputs.tags }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
            echo "$TAGS" | tr ',' '\n' | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Image built, not published" >> "$GITHUB_STEP_SUMMARY"
            echo "Set the repository variable \`NEXT_PUBLIC_SITE_URL\` to publish it to ghcr.io." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to production
    needs: image
    # Published images of main only: after CI, or run by hand on main.
    if: >-
      needs.image.outputs.published == 'true' &&
      (github.event_name == 'workflow_run' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        id: deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$HOST" ] || [ -z "$USER_NAME" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Not deployed::Add the secrets DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_HOST and DEPLOY_USER to deploy automatically (docs/DEPLOIEMENT.md §3)."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$USER_NAME@$HOST" "deploy $TAG"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Check the public site
        if: steps.deploy.outputs.deployed == 'true'
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 "$SITE_URL/api/health"; then
              echo
              echo "### Deployed \`$TAG\` to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Site not responding::$SITE_URL/api/health did not answer after the deployment."
          exit 1
